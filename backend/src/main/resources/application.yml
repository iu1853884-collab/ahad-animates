server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: ahad-animates-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ahad_animates}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:250MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:251MB}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cookie:
    secure: ${JWT_COOKIE_SECURE:false}

admin:
  initial:
    email: ${ADMIN_INITIAL_EMAIL:}
    password: ${ADMIN_INITIAL_PASSWORD:}
    name: ${ADMIN_INITIAL_NAME:Ahad Admin}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

media:
  storage:
    directory: ${MEDIA_STORAGE_DIRECTORY:./data/media}

logging:
  level:
    root: INFO
    com.ahadanimates.backend: INFO
    org.springframework.security: WARN
